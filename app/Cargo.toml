[workspace]
resolver = "3"
members = ["crates/optgraph-core", "crates/optgraph-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Iterating: small debug info, dependencies (GPUI, wgpu) optimised enough to
# render smoothly in debug builds.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.release]
debug = false
