<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- No external requests: only inline code, and fetch() limited to this page's origin (?src=). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'self'">
<title>optgraph</title>
<style>
/*__CSS__*/
</style>
</head>
<body>
<div id="shell">
  <aside id="sidebar" aria-label="Lists">
    <div class="brand">
      <svg class="logo" width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="2" width="20" height="4.2" rx="2.1"/><rect x="5" y="8.9" width="16" height="4.2" rx="2.1" opacity=".62"/><rect x="9" y="15.8" width="12" height="4.2" rx="2.1" opacity=".34"/></svg>
      <span>optgraph</span>
    </div>
    <div class="sheet-head"><b id="lists-title"></b><button id="lists-close" class="icon-btn" type="button" aria-label="Close the list">×</button></div>
    <button id="search-trigger" class="search-trigger" type="button" aria-haspopup="dialog" aria-keyshortcuts="/ Control+K" disabled>
      <span class="ico-slot" data-icon="search"></span><span>Search options, modules</span><kbd>/</kbd>
    </button>
    <nav id="lists"></nav>
  </aside>
  <header id="topbar">
    <span class="top-brand" title="optgraph"><svg class="logo" width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="2" width="20" height="4.2" rx="2.1"/><rect x="5" y="8.9" width="16" height="4.2" rx="2.1" opacity=".62"/><rect x="9" y="15.8" width="12" height="4.2" rx="2.1" opacity=".34"/></svg></span>
    <div id="crumb"></div>
    <div id="status"></div>
    <span class="spacer"></span>
    <span id="counts"></span>
    <label class="btn file-btn" title="Open a graph.json made by optgraph"><span class="ico-slot" data-icon="open"></span><span>Open graph.json</span><input id="file-input" type="file" accept=".json,application/json"></label>
  </header>
  <main id="stage">
    <canvas id="graph" aria-label="Module import graph"></canvas>
    <div id="graph-banner" hidden></div>
    <div id="graph-tip" role="tooltip" hidden></div>
    <div id="legend"></div>
    <div id="zoom" role="group" aria-label="Zoom">
      <button id="zoom-in" class="icon-btn" type="button" title="Zoom in" aria-label="Zoom in"><span class="ico-slot" data-icon="plus"></span></button>
      <button id="zoom-out" class="icon-btn" type="button" title="Zoom out" aria-label="Zoom out"><span class="ico-slot" data-icon="minus"></span></button>
      <button id="zoom-fit" class="icon-btn" type="button" title="Fit the graph" aria-label="Fit the graph"><span class="ico-slot" data-icon="fit"></span></button>
    </div>
  </main>
  <aside id="inspector" aria-label="Details" data-sheet="peek">
    <button id="sheet-handle" class="sheet-handle" type="button" aria-label="Resize the details sheet"><span></span></button>
    <div id="detail"></div>
  </aside>
  <nav id="tabs" aria-label="Views">
    <button type="button" data-tab="graph" class="on"><span class="ico-slot" data-icon="graph"></span><span>Graph</span></button>
    <button type="button" data-tab="search"><span class="ico-slot" data-icon="search"></span><span>Search</span></button>
    <button type="button" data-tab="overrides"><span class="ico-slot" data-icon="override"></span><span>Overrides</span><b class="tab-count"></b></button>
    <button type="button" data-tab="off"><span class="ico-slot" data-icon="off"></span><span>Off</span><b class="tab-count"></b></button>
    <button type="button" data-tab="errors"><span class="ico-slot" data-icon="error"></span><span>Errors</span><b class="tab-count"></b></button>
  </nav>
</div>
<div id="empty">
  <div class="drop">
    <svg class="logo" width="40" height="40" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="2" width="20" height="4.2" rx="2.1"/><rect x="5" y="8.9" width="16" height="4.2" rx="2.1" opacity=".62"/><rect x="9" y="15.8" width="12" height="4.2" rx="2.1" opacity=".34"/></svg>
    <h1>optgraph</h1>
    <p>Drop a <code>graph.json</code> made by <code>optgraph</code> here, or use <em>Open graph.json</em>.</p>
    <label class="btn primary file-btn">Open graph.json<input id="file-input-empty" type="file" accept=".json,application/json"></label>
    <p class="muted">Everything stays in this page: nothing is uploaded or fetched from elsewhere.</p>
    <p id="load-error" class="error" hidden></p>
  </div>
</div>
<div id="palette" hidden>
  <div class="palette-scrim"></div>
  <div class="palette-box" role="dialog" aria-modal="true" aria-label="Search options and modules">
    <div class="palette-field">
      <span class="ico-slot" data-icon="search"></span>
      <input id="palette-input" type="text" placeholder="Search options and modules" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="palette-list" aria-autocomplete="list">
      <kbd>Esc</kbd>
    </div>
    <div id="palette-list" role="listbox" aria-label="Results"></div>
    <div class="palette-foot">
      <span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>↵</kbd> open</span><span><kbd>Esc</kbd> close</span><span id="palette-count"></span>
    </div>
  </div>
</div>
<div id="warnings-panel" class="popover" hidden>
  <div class="panel-head"><strong>Warnings</strong><button id="warnings-close" class="icon-btn" type="button" aria-label="Close">×</button></div>
  <div id="warnings-list"></div>
</div>
<script type="application/json" id="optgraph-data">/*OPTGRAPH_DATA*/null</script>
<script>
/*__VENDOR__*/
</script>
<script>
/*__APP__*/
</script>
</body>
</html>
