<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- No external requests: only inline code, and fetch() limited to this page's origin (?src=). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'self'">
<title>optgraph</title>
<style>
/*__CSS__*/
</style>
</head>
<body>
<header id="topbar">
  <span class="brand">optgraph</span>
  <span id="meta"></span>
  <span class="spacer"></span>
  <button id="warnings-btn" type="button" hidden></button>
  <label class="file-btn">Open graph.json<input id="file-input" type="file" accept=".json,application/json"></label>
</header>
<main id="app">
  <section id="graph-pane">
    <canvas id="graph"></canvas>
    <div id="graph-banner" hidden></div>
    <div id="legend"></div>
  </section>
  <aside id="side">
    <input id="search" type="search" placeholder="Search options (fuzzy, e.g. nethost)" autocomplete="off" spellcheck="false" disabled>
    <div id="results" class="vlist"></div>
    <div id="detail"></div>
  </aside>
</main>
<div id="empty">
  <div class="drop">
    <h1>optgraph</h1>
    <p>Drop a <code>graph.json</code> made by <code>optgraph</code> here, or use <em>Open graph.json</em>.</p>
    <p class="muted">Everything stays in this page: nothing is uploaded or fetched from elsewhere.</p>
    <p id="load-error" class="error" hidden></p>
  </div>
</div>
<div id="warnings-panel" hidden>
  <div class="panel-head"><strong>Warnings</strong><button id="warnings-close" type="button" aria-label="Close">×</button></div>
  <div id="warnings-list"></div>
</div>
<script type="application/json" id="optgraph-data">/*OPTGRAPH_DATA*/null</script>
<script>
/*__VENDOR__*/
</script>
<script>
/*__APP__*/
</script>
</body>
</html>
