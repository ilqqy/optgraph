name: native
# The native app (app/, GPUI). Kept out of ci.yml: building GPUI takes
# minutes, and `nix flake check` only runs optgraph-core's tests.
# The paths are the inputs of .#optgraph-app: the cargo build reads app/ and
# viewer/vendor/fonts/Geist*.woff2, the wrapper adds the CLI (cli/, nix/,
# and the viewer it embeds). Keep them in sync with app/package.nix and the
# filesets in flake.nix.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "flake.*"
      - "cli/**"
      - "nix/**"
      - "viewer/**"
      - ".github/workflows/native.yml"
  pull_request:
    paths:
      - "app/**"
      - "flake.*"
      - "cli/**"
      - "nix/**"
      - "viewer/**"
      - ".github/workflows/native.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Binary cache for the app (GPUI takes minutes to build). Does nothing
      # until the repository variable CACHIX_CACHE is set; pushes need the
      # secret CACHIX_AUTH_TOKEN and happen only on pushes to main, never on
      # pull requests.
      - name: Cachix
        if: vars.CACHIX_CACHE != ''
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name == 'pull_request' }}
      - name: Build .#optgraph-app
        run: nix build -L .#optgraph-app
      - name: The wrapper runs
        run: ./result/bin/optgraph-app --help
