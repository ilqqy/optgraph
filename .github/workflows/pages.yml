name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build the viewer
        run: |
          nix build .#viewer
          mkdir site
          cp result/index.html site/index.html
      # Graph of the synthetic demo configuration (demo/flake.nix, checked by
      # checks.demo), generated at deploy time so it always matches the code;
      # the page loads ./demo.json by itself.
      - name: Extract the demo graph
        run: nix run . -- ./demo#nixosConfigurations.demo -o site/demo.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
