name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Format
        run: nix fmt -- --check .
      - name: Flake check
        run: nix flake check -L
      - name: Fixture extraction
        run: |
          nix run . -- ./tests/fixture#nixosConfigurations.test -o graph.json
          jq '{modules: (.modules|length), options: (.options|length)}' graph.json
          du -h graph.json
      - uses: actions/upload-artifact@v4
        with:
          name: graph-json
          path: graph.json
